<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  (click)="cerrar.emit()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="titulo-resena"
>
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative" (click)="$event.stopPropagation()">
    <button
      type="button"
      class="absolute top-3 right-4 text-gray-500 hover:text-gray-800 text-2xl leading-none"
      aria-label="Cerrar"
      (click)="cerrar.emit()"
    >
      &times;
    </button>

    <h3 id="titulo-resena" class="text-xl font-bold text-[#7494ec]">Reseñar al colaborador</h3>
    <p class="text-sm text-gray-600 mt-1">
      <strong>{{ contrato.nombreColaborador }}</strong> · {{ contrato.nombreContrato }}
    </p>

    <div class="mt-5 text-center">
      <p class="text-sm font-medium text-gray-700 mb-2">¿Cómo calificas el servicio?</p>
      <app-estrellas [(valor)]="puntuacion" [editable]="true" tamano="2rem"></app-estrellas>
      <p *ngIf="intentoEnvio && !puntuacion" class="text-sm text-red-600 mt-2">Elige de 1 a 5 estrellas.</p>
    </div>

    <label class="block mt-5 text-sm font-medium text-gray-700" for="comentario-resena">
      Comentario <span class="text-gray-400 font-normal">(opcional)</span>
    </label>
    <textarea
      id="comentario-resena"
      [(ngModel)]="comentario"
      [maxlength]="maxComentario"
      rows="4"
      placeholder="Cuéntanos cómo fue tu experiencia"
      class="mt-1 w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#7494ec]"
    ></textarea>
    <p class="text-xs text-gray-400 text-right">{{ comentario.length }}/{{ maxComentario }}</p>

    <div class="flex justify-end gap-3 mt-4">
      <button
        type="button"
        (click)="cerrar.emit()"
        class="px-4 py-2 text-sm border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="enviar()"
        [disabled]="enviando"
        class="px-4 py-2 text-sm bg-[#7494ec] text-white rounded-lg hover:bg-[#5a7ddb] disabled:opacity-60"
      >
        {{ enviando ? 'Enviando…' : 'Enviar reseña' }}
      </button>
    </div>
  </div>
</div>
